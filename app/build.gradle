plugins { id 'com.android.application' }

android {
    namespace 'io.maizon.webossim'
    compileSdk 35
    defaultConfig {
        applicationId 'io.maizon.webossim'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.4.2'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Host ELF executables named lib*.so must be extracted from the APK and
    // remain unmodified so Android can launch them from nativeLibraryDir.
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libmaizon_loader*.so', '**/libmaizon_proot.so']
        }
        resources { excludes += ['META-INF/NOTICE', 'META-INF/LICENSE'] }
    }
}
dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    testImplementation 'junit:junit:4.13.2'
}
