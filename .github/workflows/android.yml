name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate diagnostic JavaScript
        run: |
          node --check app/src/main/assets/graphics-doctor.js
          node --check app/src/main/assets/webos-shim.js
          node --test app/src/test/js/luna-shim.test.cjs
          node --check app/src/main/assets/compat-viewport.js
          node --test app/src/test/js/tv-viewport.test.cjs
      - name: Run unit tests and assemble APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Inspect build outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes.*dex'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/graphics-doctor.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/graphics-selftest.html'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/compat-viewport.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/webos-shim.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/uq8050psb.json'
          # This version has no JNI payload: ordinary Java code works across
          # ARMv7/ARM64 (and other Android ABIs) without separate APKs.
          NATIVE_LIBS="$(unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep '^lib/' || true)"
          if [ -n "$NATIVE_LIBS" ]; then
            echo "$NATIVE_LIBS"
            echo "A native payload was added: require both armeabi-v7a and arm64-v8a before release."
            echo "$NATIVE_LIBS" | grep '^lib/armeabi-v7a/' >/dev/null
            echo "$NATIVE_LIBS" | grep '^lib/arm64-v8a/' >/dev/null
          else
            echo 'ABI check: universal Java APK (no native JNI libs)'
          fi
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: webos-simulator-android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish installable universal debug APK and checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.3.0"
          cp app/build/outputs/apk/debug/app-debug.apk maizon-webos-emulator-v1.3.0-universal-debug.apk
          sha256sum maizon-webos-emulator-v1.3.0-universal-debug.apk > maizon-webos-emulator-v1.3.0-universal-debug.apk.sha256
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "Maizon webOS Emulator 1.3.0 — TV 16:9 / ELF inspection (experimental)" \
              --notes "Universal Java APK: installs webOS IPKs; executes supported HTML5/WASM apps, detects native/hybrid ELF packages WITHOUT running Linux/webOS binaries. TV 16:9 is per app. RetroArch native is not supported. Includes MaizoSNES LAN adapter. Debug-signed test release." \
              --prerelease
          fi
          gh release upload "$VERSION" \
            maizon-webos-emulator-v1.3.0-universal-debug.apk \
            maizon-webos-emulator-v1.3.0-universal-debug.apk.sha256 --clobber

