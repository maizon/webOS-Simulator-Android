name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate diagnostic JavaScript
        run: |
          node --check app/src/main/assets/graphics-doctor.js
          node --check app/src/main/assets/webos-shim.js
          node --test app/src/test/js/luna-shim.test.cjs
          node --check app/src/main/assets/compat-viewport.js
      - name: Run unit tests and assemble APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Inspect build outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes.*dex'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/graphics-doctor.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/graphics-selftest.html'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/compat-viewport.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/webos-shim.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/uq8050psb.json'
      - uses: actions/upload-artifact@v4
        with:
          name: webos-simulator-android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish installable debug APK as optional GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.1.0"
          cp app/build/outputs/apk/debug/app-debug.apk webos-ipk-simulator-v1.1.0-debug.apk
          gh release view "$VERSION" >/dev/null 2>&1 ||             gh release create "$VERSION" --title "webOS IPK Simulator 1.1.0 — Luna TV API (experimental)"               --notes "Install the debug APK. This is a webOS web-app compatibility layer, not LG firmware or guaranteed compatibility."               --prerelease
          gh release upload "$VERSION" webos-ipk-simulator-v1.1.0-debug.apk --clobber

