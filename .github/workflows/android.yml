name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
      - name: Check tools for reproducible cross-builds
        run: |
          command -v python3
          command -v dpkg-deb
          command -v tar
          command -v xz
          echo 'NDK clang compiles Linux ELF probes; Debian QEMU-user-static downloaded with checksum verification'
      - name: Build native PRoot ARMv7/ARM64 and bundled Debian Linux sysroots
        run: |
          bash tools/build-native-runtime.sh
          bash tools/build-linux-sysroots.sh
          for abi in armeabi-v7a arm64-v8a; do
            test -s "app/src/main/jniLibs/$abi/libmaizon_proot.so"
            test -s "app/src/main/jniLibs/$abi/libmaizon_loader.so"
            test -s "app/src/main/assets/native-linux/$abi-rootfs.tar.gz"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate diagnostic JavaScript
        run: |
          node --check app/src/main/assets/graphics-doctor.js
          node --check app/src/main/assets/webos-shim.js
          node --test app/src/test/js/luna-shim.test.cjs
          node --check app/src/main/assets/compat-viewport.js
          node --test app/src/test/js/tv-viewport.test.cjs
      - name: Run unit tests and assemble APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Inspect build outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes.*dex'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/graphics-doctor.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/graphics-selftest.html'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/compat-viewport.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/webos-shim.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/uq8050psb.json'
          for abi in armeabi-v7a arm64-v8a; do
            unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx "lib/$abi/libmaizon_proot.so"
            unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx "lib/$abi/libmaizon_loader.so"
            unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx "assets/native-linux/$abi-rootfs.tar.gz"
          done
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx "assets/native-licenses/PROOT_GPL2.txt"
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'classes.dex'
          echo 'Universal ARM32+ARM64 PRoot binaries and Debian sysroots are present'
          du -h app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: maizon-webos-emulator-1.4.0-universal-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish installable universal debug APK and checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.4.0"
          cp app/build/outputs/apk/debug/app-debug.apk maizon-webos-emulator-v1.4.0-universal-debug.apk
          sha256sum maizon-webos-emulator-v1.4.0-universal-debug.apk > maizon-webos-emulator-v1.4.0-universal-debug.apk.sha256
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "Maizon webOS Emulator 1.4.0 — Linux ELF PRoot ARM32/ARM64 (experimental)" \
              --notes "ARM32+ARM64 single debug APK with independently-built GPL-2.0 PRoot launchers and small Debian Linux ARM sysroots. Experimental terminal Linux ELF execution; GPU/SDL/Wayland/RetroArch native are NOT operational or hardware-validated. Existing MaizoSNES WebGL/WSS/LAN retained. Source and licences in repo." \
              --prerelease
          fi
          gh release upload "$VERSION" \
            maizon-webos-emulator-v1.4.0-universal-debug.apk \
            maizon-webos-emulator-v1.4.0-universal-debug.apk.sha256 --clobber

